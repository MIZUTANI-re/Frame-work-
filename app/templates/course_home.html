{% extends "base.html" %}
{% block title %}{{ course.name }} - Frame-work{% endblock %}
{% block heading %}{{ course.name }}{% endblock %}
{% block content %}
{% if my_team %}
  <p>あなたの班：<a href="/teams/{{ my_team.id }}">{{ my_team.name }}</a></p>
{% else %}
  <p class="muted">班はまだ決まっていません。先生が班を分けるまで待ってください。</p>
{% endif %}
{% endblock %}
