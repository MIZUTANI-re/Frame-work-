{% extends "base.html" %}
{% block title %}ログイン - Frame-work{% endblock %}
{% block plain %}
<h1>ログイン</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <label>名前 <input name="name" maxlength="100" required autofocus></label>
  <label>パスワード <input name="password" type="password" required></label>
  <button type="submit">ログイン</button>
</form>
<p class="muted">初めての学生は <a href="/join">招待コードで授業に参加</a> してください。</p>
{% endblock %}
