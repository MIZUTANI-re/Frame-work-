<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame-work 見本 v2</title>
<style>
/* 色はアプリ本体（app/static/css/style.css）と同じ */
:root {
  --rail-bg: #464775; --rail-text: #fff; --rail-active: #6264a7;
  --side-bg: #f0f0f0; --main-bg: #fff; --text: #242424; --muted: #707070;
  --accent: #5b5fc7; --accent-soft: #e8e9f8; --border: #d6d6d6; --radius: 6px; --gap: 16px;
  --warn-bg: #fff8e1; --warn-border: #f2c94c; --ok: #2e7d32;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--text); background: var(--main-bg); }
.shell { display: flex; min-height: 100vh; }
.rail { width: 64px; background: var(--rail-bg); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; flex-shrink: 0; }
.rail-item { width: 44px; height: 44px; border-radius: var(--radius); background: rgba(255,255,255,.12); color: var(--rail-text); display: flex; align-items: center; justify-content: center; font-weight: bold; }
.rail-item.active { background: var(--rail-active); }
.side { width: 230px; background: var(--side-bg); padding: var(--gap) 12px; flex-shrink: 0; }
.side h2 { font-size: 1rem; margin: 0 0 12px; padding: 0 4px; }
.side .area { margin-bottom: 18px; }
.side .area-title { font-size: .78rem; font-weight: bold; color: var(--muted); letter-spacing: .05em; padding: 0 4px 4px; border-bottom: 1px solid #ddd; margin-bottom: 4px; }
.side a { display: block; padding: 6px 8px; border-radius: var(--radius); color: var(--text); text-decoration: none; font-size: .93rem; cursor: pointer; }
.side a:hover { background: #e6e6e6; }
.side a.on { background: #dcdcf2; font-weight: bold; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mock-banner { background: var(--warn-bg); border-bottom: 1px solid var(--warn-border); padding: 6px var(--gap); font-size: .85rem; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px var(--gap); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.topbar .title { flex: 1; font-weight: bold; }
.crumb { color: var(--muted); font-weight: normal; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button { border: none; background: #fff; padding: 6px 12px; cursor: pointer; font-size: .9rem; }
.seg button.on { background: var(--accent); color: #fff; }
.content { padding: var(--gap); flex: 1; }
.lead { margin: 0 0 12px; color: var(--muted); }
button.primary { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 8px 14px; cursor: pointer; font-size: .95rem; }
button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); border-radius: var(--radius); padding: 5px 12px; cursor: pointer; font-size: .88rem; }
button.small { padding: 2px 8px; font-size: .8rem; }
button:disabled { opacity: .45; cursor: default; }
.panel { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: var(--gap); }
.panel h3 { margin: 0 0 8px; font-size: 1rem; }
.pill { display: inline-block; font-size: .75rem; padding: 1px 8px; border-radius: 999px; background: #f3f3f3; }
.pill.now { background: var(--accent); color: #fff; }
.pill.done { background: #e3f1e4; color: var(--ok); }

/* 授業の流れの帯 */
.flowbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 12px; background: #fafafa; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; }
.flowbar .fl { padding: 4px 10px; border-radius: var(--radius); font-size: .9rem; cursor: pointer; }
.flowbar .fl.done { color: var(--ok); }
.flowbar .fl.now { background: var(--accent); color: #fff; font-weight: bold; }
.flowbar .fl.waiting { color: #aaa; cursor: default; }
.flowbar .fl.viewing { outline: 2px solid var(--accent); }
.flowbar .next { margin-left: auto; }

/* 進め方（フェーズ）の帯 */
.phasebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.step { padding: 3px 10px; border-radius: 999px; background: #f3f3f3; color: var(--muted); font-size: .82rem; cursor: pointer; }
.step.done { background: var(--accent-soft); color: var(--accent); }
.step.now { background: var(--accent); color: #fff; font-weight: bold; }
.arrow { color: var(--muted); }
.timer { margin-left: auto; font-weight: bold; }
.notice { background: var(--accent-soft); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 10px; font-size: .9rem; }
.notice.gray { background: #f3f3f3; }

/* ボードと材料 */
.board-wrap { display: flex; gap: 12px; align-items: flex-start; }
.board-area { flex: 1; min-width: 0; }
.materials { width: 250px; flex-shrink: 0; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; background: #fcfcff; }
.materials h3 { margin: 0 0 4px; font-size: .95rem; }
.materials .from { font-size: .78rem; color: var(--muted); margin-bottom: 8px; }
.mat { border: 1px solid #e3e3f3; background: #fff; border-radius: var(--radius); padding: 6px 8px; margin-bottom: 6px; font-size: .85rem; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.mat .kind { font-size: .7rem; color: var(--accent); display: block; }
.note { background: #fff4b8; border-radius: 4px; padding: 8px 10px; box-shadow: 0 1px 3px rgba(0,0,0,.18); font-size: .88rem; width: 150px; min-height: 60px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.note .who { font-size: .72rem; color: #555; display: flex; justify-content: space-between; gap: 4px; }
.note .src { font-size: .68rem; color: var(--accent); }
.votes { color: var(--accent); letter-spacing: 2px; }
.notes { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
.zone-grid { display: grid; gap: 8px; }
.zone { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; min-height: 170px; background: #fcfcfc; }
.zone h3 { margin: 0; font-size: .98rem; }
.zone .hint { font-size: .78rem; color: var(--muted); margin: 2px 0 8px; }
.cluster { border: 2px dashed var(--accent); border-radius: var(--radius); padding: 8px; background: #fafaff; }
.cluster-title { font-weight: bold; color: var(--accent); margin-bottom: 6px; font-size: .88rem; }
.axis-wrap { display: grid; grid-template-columns: 26px 1fr; grid-template-rows: 1fr 26px; gap: 4px; }
.axis-y { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; }
.axis-x { grid-column: 2; font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; }
.plane { position: relative; height: 430px; border: 1px solid var(--border); border-radius: var(--radius); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; overflow: hidden; }
.quad { border: 1px dashed var(--border); padding: 8px; font-weight: bold; color: #b0b0b0; }
.quad.q-do_now { background: #f3fbf3; }
.plane .note { position: absolute; transform: translate(-50%, -50%); width: 135px; }
.readonly { opacity: .92; }

/* 探して選ぶ */
.search { width: 100%; padding: 10px 12px; font-size: 1.05rem; border: 2px solid var(--accent); border-radius: var(--radius); }
.cands { margin: 8px 0 var(--gap); border: 1px solid var(--border); border-radius: var(--radius); }
.cand { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.cand:last-child { border-bottom: none; }
.cand .body { flex: 1; min-width: 0; }
.cand .name { font-weight: bold; }
.cand .sub { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.badge { display: inline-block; font-size: .72rem; padding: 1px 8px; border-radius: 999px; background: #f3f3f3; margin-left: 6px; font-weight: normal; }
.uses { font-size: .8rem; color: var(--muted); white-space: nowrap; }
mark { background: #ffe58a; padding: 0; }
.chat { border: 1px solid var(--border); border-radius: var(--radius); }
.chat-head { padding: 8px 12px; border-bottom: 1px solid var(--border); background: #fafafa; font-weight: bold; font-size: .92rem; display: flex; justify-content: space-between; }
.chat-log { padding: 10px 12px; min-height: 90px; max-height: 220px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 75%; padding: 7px 10px; border-radius: 10px; font-size: .9rem; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
.msg.assistant { align-self: flex-start; background: #f1f1f1; color: #555; }
.chat-input { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
.chat-input input { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: .95rem; }

/* 授業の流れ */
.flow-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #eee; }
.flow-row:last-child { border-bottom: none; }
.flow-no { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
.flow-row .phases { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; font-size: .9rem; }
.muted { color: var(--muted); font-size: .82rem; }

/* まとめシート */
.sheet { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; max-width: 900px; }
.sheet-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-size: 1.15rem; }
.sec { margin-bottom: 12px; }
.sec h3 { margin: 0 0 4px; font-size: .98rem; }
.sec ul { margin: 4px 0 0; padding-left: 20px; font-size: .9rem; }
.final textarea { width: 100%; min-height: 70px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: .95rem; font-family: inherit; }
.llm-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.slot { border: 2px dashed #c9c9e6; border-radius: var(--radius); padding: 10px; background: #fbfbff; min-height: 90px; }
.slot h4 { margin: 0 0 6px; font-size: .88rem; color: var(--accent); }
.slot p { margin: 0; font-size: .82rem; color: var(--muted); }
.saved { margin-top: 12px; }
.saved img { max-width: 420px; width: 100%; border: 1px solid var(--border); border-radius: var(--radius); display: block; margin: 6px 0; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px; border-radius: var(--radius); display: none; z-index: 10; }
.empty { padding: 12px; color: var(--muted); }

@media (max-width: 760px) {
  .side { display: none; }
  .board-wrap { flex-direction: column; }
  .materials { width: 100%; }
  .zone-grid { grid-template-columns: 1fr !important; }
  .llm-slots { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail"><div class="rail-item active">演</div><div class="rail-item" style="background:transparent;border:1px dashed rgba(255,255,255,.5)">＋</div></nav>
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="mock-banner">これは<b>見本の画面 v2</b> です（本物はステップ 2〜5 で作ります）。付箋・回数・会話は見本のデータです。</div>
    <div class="topbar">
      <div class="title" id="title"></div>
      <span class="muted">見る人</span>
      <div class="seg" id="viewer-seg"><button data-v="teacher">教員</button><button data-v="A">学生A</button></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== フレームワークの定義（docs/06_framework_design.md §2 の形）=====
const FRAMEWORKS = [
  { key: "brainstorm", name: "ブレインストーミング", aliases: ["ブレスト", "アイデア出し", "brainstorming"], yomi: ["ぶれいんすとーみんぐ", "あいであだし", "はっそう"], tags: ["発想", "アイデア", "量を出す"],
    board_type: "zone", layout: { columns: 1 }, zones: [{ key: "main", label: "テーマ：学園祭で新しくやる企画", hint: "質より量。人の案を否定しない" }],
    phases: [{ key: "individual", default_minutes: 5 }, { key: "reveal" }, { key: "cluster" }, { key: "vote", votes_per_person: 3 }, { key: "conclusion" }],
    meta: { purpose: "ideate", thinking: "diverge", description: "テーマについて、思いつく案をできるだけ多く出す" }, uses: 12 },
  { key: "swot", name: "SWOT 分析", aliases: ["スウォット", "SWOT分析", "強み弱み"], yomi: ["すうぉっと", "つよみよわみ", "ぶんせき", "げんじょうはあく"], tags: ["分析", "現状把握", "戦略"],
    board_type: "zone", layout: { columns: 2 }, zones: [
      { key: "S", label: "強み Strengths", hint: "内部・プラス" }, { key: "W", label: "弱み Weaknesses", hint: "内部・マイナス" },
      { key: "O", label: "機会 Opportunities", hint: "外部・プラス" }, { key: "T", label: "脅威 Threats", hint: "外部・マイナス" }],
    phases: [{ key: "individual", default_minutes: 7 }, { key: "reveal" }, { key: "cluster" }, { key: "vote", votes_per_person: 3 }, { key: "conclusion" }],
    meta: { purpose: "analyze", thinking: "converge", description: "内部の強み・弱みと、外部の機会・脅威を 4 象限で整理する" }, uses: 8 },
  { key: "payoff_matrix", name: "ペイオフマトリクス", aliases: ["ペイオフ", "効果と実現性", "優先順位"], yomi: ["ぺいおふ", "ゆうせんじゅんい", "こうか", "じつげんせい", "けってい"], tags: ["決定", "優先順位", "選ぶ"],
    board_type: "axis", axes: { x: { label: "実現しやすさ", low: "難しい", high: "易しい" }, y: { label: "効果", low: "小さい", high: "大きい" } },
    quadrants: [{ key: "plan", label: "計画してやる" }, { key: "do_now", label: "すぐやる" }, { key: "drop", label: "やらない" }, { key: "spare", label: "手が空いたら" }],
    phases: [{ key: "individual", default_minutes: 5 }, { key: "reveal" }, { key: "vote", votes_per_person: 3 }, { key: "conclusion" }],
    meta: { purpose: "decide", thinking: "converge", description: "案を「効果」と「実現しやすさ」の 2 軸に置いて、やる順を決める" }, uses: 5 },
];
const PURPOSE = { ideate: "発想", analyze: "分析", decide: "決定" };
const THINKING = { diverge: "発散", converge: "収束" };
const PHASE = { individual: "個人ワーク", reveal: "公開", cluster: "まとめる", vote: "投票", conclusion: "結論" };
const LOCKED = ["individual", "reveal"];
const AUTHORS = { A: ["学生A", "#fff4b8"], B: ["学生B", "#d8f0ff"], C: ["学生C", "#ffe0ec"], D: ["学生D", "#dff5d8"] };
const NOTES = {
  brainstorm: [
    { a: "A", zone: "main", text: "屋台の売上を競うコンテスト", cluster: "食べ物", votes: 1 },
    { a: "B", zone: "main", text: "地域のお店とコラボした屋台", cluster: "食べ物", votes: 3 },
    { a: "C", zone: "main", text: "謎解きスタンプラリー", cluster: "体験", votes: 4 },
    { a: "A", zone: "main", text: "教室まるごと脱出ゲーム", cluster: "体験", votes: 2 },
    { a: "D", zone: "main", text: "卒業生のトークイベント", votes: 1 },
    { a: "B", zone: "main", text: "夜のプロジェクションマッピング", votes: 1 }],
  swot: [
    { a: "A", zone: "S", text: "来場者が毎年多い", votes: 2 }, { a: "B", zone: "S", text: "サークルの数が多い", votes: 1 },
    { a: "C", zone: "W", text: "準備の時間が足りない", votes: 3 }, { a: "A", zone: "W", text: "SNS の発信が弱い", votes: 2 },
    { a: "D", zone: "O", text: "駅前の再開発で人が増える", votes: 2 }, { a: "B", zone: "O", text: "地域の商店街が協力的", votes: 1, src: "ブレスト「食べ物」" },
    { a: "C", zone: "T", text: "近くの大学と日程がかぶる", votes: 1 }, { a: "D", zone: "T", text: "雨の日の対策がない", votes: 0 }],
  payoff_matrix: [
    { a: "C", x: .80, y: .82, text: "謎解きスタンプラリー", votes: 4, src: "ブレスト" }, { a: "B", x: .60, y: .70, text: "地域コラボ屋台", votes: 3, src: "ブレスト" },
    { a: "B", x: .18, y: .86, text: "プロジェクションマッピング", votes: 1 }, { a: "D", x: .78, y: .28, text: "卒業生トーク", votes: 1 },
    { a: "A", x: .30, y: .58, text: "脱出ゲーム", votes: 2, src: "ブレスト「体験」" }, { a: "A", x: .88, y: .45, text: "売上コンテスト", votes: 1 }],
};
const CONCLUSION = {
  brainstorm: "「体験」の案が多く票も集まった。謎解きスタンプラリーを軸に、地域コラボ屋台と組み合わせる。",
  swot: "強み（来場者の多さ）と機会（商店街の協力）を活かす。弱み（準備時間）は早めの役割分担で補う。",
  payoff_matrix: "すぐやる：謎解きスタンプラリー・地域コラボ屋台。計画してやる：脱出ゲーム。",
};

// ===== 画面の状態 =====
const P = new URLSearchParams(location.search);
const S = {
  viewer: P.get("viewer") || "teacher",
  view: P.get("view") || "board",           // settings / members / search / flow / board / summary / dashboard
  team: "1班",
  query: P.get("q") || "",
  flow: FRAMEWORKS.map((f, i) => ({ key: f.key, phases: f.phases.map(p => p.key), status: ["done", "active", "waiting"][i] })),
  viewing: P.get("board") || null,          // 授業中に見ているボード（終わったボードも見られる）
  phase: { brainstorm: "conclusion", swot: P.get("phase") || "individual", payoff_matrix: "individual" },
  remaining: { swot: 7 * 60 - 28, payoff_matrix: 5 * 60 },
  pasteZone: "S",
  chat: [],
  finalText: "謎解きスタンプラリーを軸に、商店街と組んだ屋台を出す。準備は 2 週間前から役割を分けて始める。",
  saved: [],
};
const fw = k => FRAMEWORKS.find(f => f.key === k);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const teacher = () => S.viewer === "teacher";
const activeKey = () => (S.flow.find(f => f.status === "active") || S.flow[S.flow.length - 1]).key;

// ===== 文字をそろえる・探す =====
function normChar(ch) { let c = ch.normalize("NFKC").toLowerCase(); const k = c.charCodeAt(0); if (c.length === 1 && k >= 0x30a1 && k <= 0x30f6) c = String.fromCharCode(k - 0x60); return c; }
const norm = s => Array.from(s).map(normChar).join("");
function highlight(text, q) {
  if (!q) return esc(text);
  const chars = Array.from(text), n = chars.map(normChar), at = n.join("").indexOf(norm(q));
  if (at < 0 || n.some(c => c.length !== 1)) return esc(text);
  const L = norm(q).length;
  return esc(chars.slice(0, at).join("")) + "<mark>" + esc(chars.slice(at, at + L).join("")) + "</mark>" + esc(chars.slice(at + L).join(""));
}
function score(f, q) {
  const nq = norm(q); if (!nq) return 0;
  if (norm(f.name).startsWith(nq)) return 4;
  if (norm(f.name).includes(nq)) return 3;
  if ([...f.aliases, ...(f.yomi || [])].some(a => norm(a).includes(nq))) return 2;
  return [f.meta.description, PURPOSE[f.meta.purpose], THINKING[f.meta.thinking], ...f.tags].map(norm).join(" ").includes(nq) ? 1 : -1;
}

// ===== 2 列目（3 つの場所。D-036）=====
function renderSide() {
  const link = (view, label, extra = "") => `<a data-view="${view}" ${extra} class="${S.view === view && (!extra || extra.includes(S.team)) ? "on" : ""}">${label}</a>`;
  const teams = teacher() ? ["1班", "2班", "3班"] : ["1班"];
  let h = `<h2>プロジェクト演習 第3回</h2>`;
  if (teacher()) h += `<div class="area"><div class="area-title">⚙ 準備（設定）</div>
    ${link("settings", "授業の設定")}${link("members", "メンバーと班")}${link("search", "フレームワークを探す")}${link("flow", "授業の流れ")}</div>`;
  h += `<div class="area"><div class="area-title">▶ 授業中</div>${teams.map(t => link("board", t, `data-team="${t}"`)).join("")}</div>`;
  h += `<div class="area"><div class="area-title">📄 成果</div>${link("summary", teacher() ? "まとめシート（全班）" : "まとめシート（1班）")}${teacher() ? link("dashboard", "ダッシュボード") : ""}</div>`;
  document.getElementById("side").innerHTML = h;
}

const TITLES = { settings: "⚙ 準備 / 授業の設定", members: "⚙ 準備 / メンバーと班", search: "⚙ 準備 / フレームワークを探す", flow: "⚙ 準備 / 授業の流れ",
  board: "▶ 授業中 / ", summary: "📄 成果 / まとめシート", dashboard: "📄 成果 / ダッシュボード" };

function render() {
  if (!teacher() && ["settings", "members", "search", "flow", "dashboard"].includes(S.view)) S.view = "board";
  if (!teacher()) S.team = "1班";
  document.querySelectorAll("#viewer-seg button").forEach(b => b.classList.toggle("on", b.dataset.v === S.viewer));
  renderSide();
  document.getElementById("title").innerHTML = `<span class="crumb">${TITLES[S.view]}</span>${S.view === "board" ? S.team : ""}`;
  const v = { settings: viewSettings, members: viewMembers, search: viewSearch, flow: viewFlow, board: viewBoard, summary: viewSummary, dashboard: viewDashboard }[S.view];
  document.getElementById("content").innerHTML = v();
  if (S.view === "search") { const s = document.querySelector(".search"); if (S.focusSearch) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
  if (S.view === "summary") drawSavedImages();
}

// ===== ⚙ 準備 =====
function viewSettings() {
  return `<p class="lead">授業そのものの設定です。授業中に触る画面とは分けています。</p>
  <div class="panel"><h3>授業の名前</h3>プロジェクト演習 第3回</div>
  <div class="panel"><h3>招待コード</h3><span style="font-size:1.6rem;letter-spacing:.2em;font-family:monospace">3XW3P9</span> <button class="ghost">再発行</button></div>
  <p class="muted">この 2 つと「メンバーと班」は、今の本物の画面（ステップ 1）ですでに動いています。</p>`;
}
function viewMembers() {
  return `<p class="lead">学生の参加と班分けです（本物はステップ 1 で動いています）。班は消さずに残ります。</p>
  <div class="panel"><h3>1班（3 人）</h3>学生A・学生H・学生G</div><div class="panel"><h3>2班（3 人）</h3>学生B・学生E・学生C</div><div class="panel"><h3>3班（2 人）</h3>学生D・学生F</div>`;
}

function viewSearch() {
  const q = S.query;
  let list = FRAMEWORKS.map(f => ({ f, s: score(f, q) })).filter(x => !q || x.s >= 0);
  list.sort((a, b) => (b.s - a.s) || (b.f.uses - a.f.uses));
  const rows = list.map(({ f }) => {
    const inFlow = S.flow.some(x => x.key === f.key);
    return `<div class="cand"><div class="body">
      <div class="name">${highlight(f.name, q)}<span class="badge">${PURPOSE[f.meta.purpose]}</span><span class="badge">${THINKING[f.meta.thinking]}</span></div>
      <div class="sub">別名：${f.aliases.map(a => highlight(a, q)).join("・")}</div><div class="sub">${esc(f.meta.description)}</div></div>
      <div class="uses">${f.uses} 回使われています</div>
      <button class="ghost" data-add="${f.key}" ${inFlow ? "disabled" : ""}>${inFlow ? "流れに入っています" : "流れに足す"}</button></div>`;
  }).join("") || `<div class="empty">合うフレームワークがありません</div>`;
  const log = S.chat.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join("") ||
    `<div class="muted">例：「新しい商品のアイデアを考える授業に合うのはどれ？」</div>`;
  return `<p class="lead">言葉を打つたびに候補が絞られます。何も打っていないときは<b>よく使われている順</b>です。選んだものの順番や進め方は「授業の流れ」で決めます。</p>
    <input class="search" placeholder="例：ブレ、ぶれすと、分析、優先順位" value="${esc(q)}">
    <div class="cands">${rows}</div>
    <div class="chat"><div class="chat-head"><span>💬 相談する（あとで LLM が答えます）</span><span class="muted">送った文は保存されます</span></div>
      <div class="chat-log" id="chat-log">${log}</div>
      <div class="chat-input"><input id="chat-text" placeholder="授業のテーマや、迷っていることを書く"><button class="primary" id="chat-send">送る</button></div></div>`;
}

function viewFlow() {
  const label = { done: `<span class="pill done">終わり</span>`, active: `<span class="pill now">いま</span>`, waiting: `<span class="pill">まだ</span>` };
  const rows = S.flow.map((x, i) => {
    const f = fw(x.key);
    const boxes = f.phases.map(ph => `<label><input type="checkbox" data-phase="${x.key}:${ph.key}" ${x.phases.includes(ph.key) ? "checked" : ""} ${LOCKED.includes(ph.key) ? "disabled" : ""}> ${PHASE[ph.key]}</label>`).join("");
    return `<div class="flow-row"><div class="flow-no">${i + 1}</div><div style="flex:1">
      <b>${esc(f.name)}</b> ${label[x.status]}
      <span style="float:right"><button class="ghost small" data-up="${i}" ${i === 0 ? "disabled" : ""}>↑</button> <button class="ghost small" data-down="${i}" ${i === S.flow.length - 1 ? "disabled" : ""}>↓</button> <button class="ghost small" data-remove="${x.key}" ${x.status !== "waiting" ? "disabled" : ""}>外す</button></span>
      <div class="phases">進め方：${boxes}</div></div></div>`;
  }).join("") || `<div class="empty">まだありません。「フレームワークを探す」で足してください。</div>`;
  return `<p class="lead">授業で使うフレームワークを、使う順に並べます。授業中は ① から順に 1 つずつ開き、先生が「次へ」を押すと次に進みます。</p>
    <div class="panel">${rows}<p class="muted">個人ワークと公開は外せません（他の人を見ずに考える時間を守るため）。始まったもの・終わったものは外せません。</p>
    <button class="primary" id="deal">全班に配る（1班・2班・3班）</button></div>`;
}

// ===== ▶ 授業中 =====
function noteHtml(n, idx, phases) {
  const [name, color] = AUTHORS[n.a];
  const showVotes = phases.includes("vote") && idx >= phases.indexOf("vote");
  const pos = n.x !== undefined ? `;left:${n.x * 100}%;top:${(1 - n.y) * 100}%` : "";
  return `<div class="note" style="background:${color}${pos}"><div>${esc(n.text)}${n.src ? `<div class="src">↩ ${esc(n.src)}から</div>` : ""}</div>
    <div class="who"><span>${name}</span><span class="votes">${showVotes ? "●".repeat(n.votes) : ""}</span></div></div>`;
}

function materialsFor(key) {
  const i = S.flow.findIndex(x => x.key === key);
  if (i <= 0) return "";
  const prev = S.flow.slice(0, i).map(x => x.key);
  const items = [];
  prev.forEach(pk => {
    const pf = fw(pk);
    [...new Set(NOTES[pk].filter(n => n.cluster).map(n => n.cluster))].forEach(c => items.push({ kind: `${pf.name}のまとまり`, text: c }));
    NOTES[pk].filter(n => n.votes >= 2).forEach(n => items.push({ kind: `${pf.name}・票 ${n.votes}`, text: n.text, from: pf.name }));
  });
  const f = fw(key);
  const zoneSel = f.board_type === "zone" ? `<div class="muted" style="margin-bottom:6px">貼る先：<select id="paste-zone">${f.zones.map(z => `<option value="${z.key}" ${S.pasteZone === z.key ? "selected" : ""}>${esc(z.label)}</option>`).join("")}</select></div>` : "";
  return `<div class="materials"><h3>材料</h3><div class="from">前のボードのまとまりと、票の多い付箋</div>${zoneSel}
    ${items.map((m, j) => `<div class="mat"><div><span class="kind">${esc(m.kind)}</span>${esc(m.text)}</div>${teacher() ? "" : `<button class="ghost small" data-paste="${j}">貼る</button>`}</div>`).join("")}</div>`;
}

function viewBoard() {
  const key = S.viewing || activeKey();
  const f = fw(key), x = S.flow.find(y => y.key === key), phases = x.phases;
  if (!phases.includes(S.phase[key])) S.phase[key] = phases[0];
  const now = S.phase[key], idx = phases.indexOf(now), blind = now === "individual" && x.status === "active";
  const readonly = x.status === "done";

  // 授業の流れの帯（D-032）
  const marks = { done: "✓", active: "▶", waiting: "" };
  const fl = S.flow.map((y, i) => `<span class="fl ${y.status} ${y.key === key ? "viewing" : ""}" ${y.status !== "waiting" ? `data-viewb="${y.key}"` : ""}>${marks[y.status]} ${"①②③④⑤"[i]} ${esc(fw(y.key).name)}</span>`).join('<span class="arrow">→</span>');
  const nextIdx = S.flow.findIndex(y => y.status === "active") + 1;
  const nextBtn = teacher() && nextIdx > 0 && nextIdx < S.flow.length ? `<button class="primary next" id="next">次へ ▶ ${esc(fw(S.flow[nextIdx].key).name)}</button>` : "";

  const steps = phases.map((p, i) => `<span class="step ${i < idx ? "done" : i === idx ? "now" : ""}" data-step="${key}:${p}">${PHASE[p]}</span>`).join('<span class="arrow">›</span>');
  const sec = S.remaining[key] || 0;
  const timer = blind ? `<span class="timer" id="timer">残り ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}（0:00 で自動公開）</span>` : "";

  let notes = NOTES[key];
  if (blind && !teacher()) notes = notes.filter(n => n.a === S.viewer);
  let notice;
  if (readonly) notice = `<div class="notice gray">このボードは終わりました。<b>見るだけ</b>で残っています。</div>`;
  else if (teacher()) notice = `<div class="notice gray">教員は<b>閲覧中</b>です（書き込みはしません）。${blind ? "個人ワーク中も、全員の付箋が見えています。" : ""}</div>`;
  else notice = blind ? `<div class="notice">他の人の付箋は、まだ見えません。時間が来たら自動で公開されます。</div>` : `<div class="notice">全員の付箋が見えています（作成者の名前つき）。</div>`;
  const addBtn = teacher() || readonly ? "" : `<button class="primary" id="add" style="margin-bottom:10px">＋ 付箋を足す</button>`;

  let board = "";
  if (f.board_type === "zone") {
    const showCl = phases.includes("cluster") && idx >= phases.indexOf("cluster");
    board = `<div class="zone-grid" style="grid-template-columns:repeat(${f.layout.columns},1fr)">${f.zones.map(z => {
      const zn = notes.filter(n => n.zone === z.key);
      let inner;
      if (showCl && zn.some(n => n.cluster)) {
        const groups = [...new Set(zn.filter(n => n.cluster).map(n => n.cluster))];
        inner = groups.map(g => `<div class="cluster"><div class="cluster-title">まとまり：${esc(g)}</div><div class="notes">${zn.filter(n => n.cluster === g).map(n => noteHtml(n, idx, phases)).join("")}</div></div>`).join("") + zn.filter(n => !n.cluster).map(n => noteHtml(n, idx, phases)).join("");
      } else inner = zn.map(n => noteHtml(n, idx, phases)).join("");
      return `<div class="zone"><h3>${esc(z.label)}</h3><div class="hint">${esc(z.hint)}</div><div class="notes">${inner}</div></div>`;
    }).join("")}</div>`;
  } else {
    board = `<div class="axis-wrap"><div class="axis-y"><span>${esc(f.axes.y.low)}</span><b>${esc(f.axes.y.label)} →</b><span>${esc(f.axes.y.high)}</span></div>
      <div class="plane">${f.quadrants.map(q => `<div class="quad q-${q.key}">${esc(q.label)}</div>`).join("")}${notes.map(n => noteHtml(n, idx, phases)).join("")}</div>
      <div class="axis-x"><span>${esc(f.axes.x.low)}</span><b>${esc(f.axes.x.label)} →</b><span>${esc(f.axes.x.high)}</span></div></div>`;
  }
  const concl = now === "conclusion" ? `<div class="panel" style="margin-top:10px;border-color:var(--accent)"><h3 style="color:var(--accent)">このボードの結論</h3>${esc(CONCLUSION[key])}</div>` : "";
  const mats = readonly ? "" : materialsFor(key);
  return `<div class="flowbar">${fl}${nextBtn}</div>
    <div class="phasebar">${steps}${timer}</div>${notice}${addBtn}
    <div class="board-wrap"><div class="board-area ${readonly ? "readonly" : ""}">${board}${concl}</div>${mats}</div>
    <p class="muted" style="margin-top:10px">見本の操作：進め方の丸を押すとフェーズが変わります。流れの帯で、終わったボードも開けます。</p>`;
}

// ===== 📄 成果：まとめシート（D-034・D-035）=====
function topVoted(k) { return NOTES[k].filter(n => n.votes >= 2).sort((a, b) => b.votes - a.votes); }
function viewSummary() {
  const secs = S.flow.map((x, i) => {
    const f = fw(x.key);
    return `<div class="sec"><h3>${"①②③④⑤"[i]} ${esc(f.name)}</h3><div>${esc(CONCLUSION[x.key])}</div>
      <ul>${topVoted(x.key).map(n => `<li>${esc(n.text)}（票 ${n.votes}・${AUTHORS[n.a][0]}）</li>`).join("")}</ul></div>`;
  }).join("");
  const slot = (t) => `<div class="slot"><h4>🤖 ${t}</h4><p>LLM はまだありません。あとでここを LLM が埋めます。</p></div>`;
  const saved = S.saved.map(s => `<div><b>版 ${s.v}</b>（${s.at}）<img data-img="${s.v}" alt="まとめシート 版 ${s.v}"><a download="1班_まとめ_版${s.v}.png" data-dl="${s.v}">画像を保存</a></div>`).join("");
  const others = teacher() ? `<p class="muted">先生は 2班・3班 のシートも並べて見られます（見本では 1班だけ）。</p>` : "";
  return `<p class="lead">班ごとに 1 枚。流れの最後に、固まった意見をここにまとめて残します。「確定」すると、その時のシートを画像にして残します。</p>${others}
  <div class="sheet" id="sheet">
    <div class="sheet-head"><h2>1班 まとめシート</h2><div class="muted">プロジェクト演習 第3回 ／ 学生A・学生H・学生G</div></div>
    ${secs}
    <div class="sec final"><h3>班の最終の結論</h3>${teacher() ? `<div>${esc(S.finalText)}</div>` : `<textarea id="final">${esc(S.finalText)}</textarea>`}</div>
    <div class="llm-slots">${slot("要約")}${slot("似た意見のまとめ")}${slot("次にやること")}</div>
    ${teacher() ? "" : `<button class="primary" id="confirm">確定して画像で残す</button>`}
    <span class="muted">画像は確定のときに 1 回だけ、ブラウザで作ります（サーバーは重い処理をしません）。前の版も残ります。</span>
  </div>
  <div class="saved">${saved}</div>`;
}
function viewDashboard() { return `<p class="lead">ステップ 5 で作ります。記録（誰が何枚・どの区画・どうまとめ・何を選んだか）から作ります。</p>`; }

// まとめシートを画像にする（見本：canvas に描く）
function sheetToImage() {
  const W = 900, pad = 28, lh = 22, c = document.createElement("canvas"), ctx = c.getContext("2d");
  const lines = [["h", "1班 まとめシート"], ["m", "プロジェクト演習 第3回 ／ 学生A・学生H・学生G"], ["s", ""]];
  S.flow.forEach((x, i) => { lines.push(["b", `${"①②③④⑤"[i]} ${fw(x.key).name}`]); lines.push(["t", CONCLUSION[x.key]]); topVoted(x.key).forEach(n => lines.push(["t", `・${n.text}（票 ${n.votes}）`])); lines.push(["s", ""]); });
  lines.push(["b", "班の最終の結論"]); lines.push(["t", S.finalText]); lines.push(["s", ""]); lines.push(["m", "要約・似た意見のまとめ・次にやること：LLM はまだありません"]);
  const font = { h: "bold 24px sans-serif", b: "bold 17px sans-serif", t: "15px sans-serif", m: "13px sans-serif", s: "13px sans-serif" };
  const wrapped = [];
  ctx.font = font.t;
  lines.forEach(([k, t]) => { ctx.font = font[k]; let cur = ""; for (const ch of t) { if (ctx.measureText(cur + ch).width > W - pad * 2) { wrapped.push([k, cur]); cur = ch; } else cur += ch; } wrapped.push([k, cur]); });
  c.width = W; c.height = pad * 2 + wrapped.length * lh + 10;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = "#5b5fc7"; ctx.fillRect(0, 0, W, 6);
  let y = pad + 10;
  wrapped.forEach(([k, t]) => { ctx.font = font[k]; ctx.fillStyle = k === "m" ? "#707070" : k === "b" ? "#5b5fc7" : "#242424"; ctx.fillText(t, pad, y); y += k === "h" ? lh + 6 : lh; });
  return c.toDataURL("image/png");
}
function drawSavedImages() { S.saved.forEach(s => { const img = document.querySelector(`img[data-img="${s.v}"]`); const a = document.querySelector(`a[data-dl="${s.v}"]`); if (img) img.src = s.url; if (a) a.href = s.url; }); }

// ===== 操作 =====
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2600); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-v],[data-view],[data-add],[data-up],[data-down],[data-remove],[data-step],[data-viewb],[data-paste],button,a") || e.target;
  const d = t.dataset || {};
  if (d.v) { S.viewer = d.v; S.viewing = null; render(); }
  else if (d.view) { S.view = d.view; if (d.team) S.team = d.team; S.viewing = null; render(); }
  else if (d.add) { S.flow.push({ key: d.add, phases: fw(d.add).phases.map(p => p.key), status: "waiting" }); toast("授業の流れに足しました。順番と進め方は「授業の流れ」で決めます"); render(); }
  else if (d.up || d.down) { const i = +(d.up ?? d.down), j = d.up ? i - 1 : i + 1; [S.flow[i], S.flow[j]] = [S.flow[j], S.flow[i]]; render(); }
  else if (d.remove) { S.flow = S.flow.filter(x => x.key !== d.remove); render(); }
  else if (d.step) { const [k, p] = d.step.split(":"); S.phase[k] = p; render(); }
  else if (d.viewb) { S.viewing = d.viewb === activeKey() ? null : d.viewb; render(); }
  else if (d.paste !== undefined) {
    const key = S.viewing || activeKey(), f = fw(key), m = e.target.closest(".mat").querySelector("div").lastChild.textContent;
    NOTES[key].push(f.board_type === "zone" ? { a: S.viewer, zone: S.pasteZone, text: m, votes: 0, src: "材料" } : { a: S.viewer, x: .5, y: .5, text: m, votes: 0, src: "材料" });
    toast("材料から貼りました（どこから来たかも残ります）"); render();
  }
  else if (t.id === "deal") toast("1班・2班・3班に配りました（見本）");
  else if (t.id === "next") { const i = S.flow.findIndex(y => y.status === "active"); S.flow[i].status = "done"; S.flow[i + 1].status = "active"; S.phase[S.flow[i + 1].key] = "individual"; S.viewing = null; toast(`${fw(S.flow[i + 1].key).name} を開きました`); render(); }
  else if (t.id === "add") { const text = prompt("付箋に書くこと"); if (text) { const key = S.viewing || activeKey(), f = fw(key); NOTES[key].push(f.board_type === "zone" ? { a: S.viewer, zone: f.zones[0].key, text, votes: 0 } : { a: S.viewer, x: .5, y: .5, text, votes: 0 }); render(); } }
  else if (t.id === "chat-send") sendChat();
  else if (t.id === "confirm") { const ta = document.getElementById("final"); if (ta) S.finalText = ta.value; const v = S.saved.length + 1; S.saved.push({ v, at: new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }), url: sheetToImage() }); toast(`版 ${v} として画像で残しました（本物ではサーバーの保存係に送ります）`); render(); }
});
function sendChat() {
  const inp = document.getElementById("chat-text"); const text = inp.value.trim(); if (!text) return;
  S.chat.push({ role: "user", text }, { role: "assistant", text: "（LLM はまだつながっていません。あとでここに答えが出ます。送った文は保存しました）" });
  render(); const log = document.getElementById("chat-log"); log.scrollTop = log.scrollHeight;
}
document.addEventListener("keydown", e => { if (e.target.id === "chat-text" && e.key === "Enter" && !e.isComposing) sendChat(); });
document.addEventListener("change", e => {
  const d = e.target.dataset;
  if (d.phase) { const [k, ph] = d.phase.split(":"); const x = S.flow.find(y => y.key === k); const all = fw(k).phases.map(p => p.key); x.phases = all.filter(p => p === ph ? e.target.checked : x.phases.includes(p)); render(); }
  if (e.target.id === "paste-zone") S.pasteZone = e.target.value;
});
document.addEventListener("input", e => {
  if (e.target.classList.contains("search")) { S.query = e.target.value; S.focusSearch = true; render(); }
  if (e.target.id === "final") S.finalText = e.target.value;
});
setInterval(() => {
  const k = activeKey();
  if (S.phase[k] === "individual" && S.remaining[k] > 0) {
    S.remaining[k]--;
    if (S.remaining[k] === 0) { S.phase[k] = "reveal"; toast("時間になったので公開しました"); if (S.view === "board") render(); }
    const tm = document.getElementById("timer");
    if (tm && S.view === "board" && !S.viewing) { const s = S.remaining[k]; tm.textContent = `残り ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}（0:00 で自動公開）`; }
  }
}, 1000);

if (P.get("chat")) S.chat.push({ role: "user", text: P.get("chat") }, { role: "assistant", text: "（LLM はまだつながっていません。あとでここに答えが出ます。送った文は保存しました）" });
if (P.get("saved")) { S.view = "summary"; S.viewer = "A"; }
render();
if (P.get("saved")) document.getElementById("confirm").click();
</script>
</body>
</html>
