services:
  # アプリの箱
  app:
    build: .
    env_file: deploy.env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"   # PC の外には開けない（外からはトンネルだけが入る）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Cloudflare Tunnel（仮の URL を作る入口）。URL は docker compose logs tunnel に出る
  tunnel:
    image: cloudflare/cloudflared:latest   # 版を確かめられなかったので latest（本人が確認して固定する）
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
